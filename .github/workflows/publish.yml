# Render the Quarto site and publish it to the gh-pages branch on every push to main.
# Two repo settings must be set, or the publish step fails. Actions needs read and
# write workflow permissions, and Pages must serve from gh-pages. See MIGRATION.md.
name: Render and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
