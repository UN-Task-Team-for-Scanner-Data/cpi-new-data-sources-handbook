project:
  type: website

website:
  title: "Handbook on utilising new data sources in the production of consumer price statistics"
  site-url: https://un-task-team-for-scanner-data.github.io/cpi-new-data-sources-handbook/
  repo-url: https://github.com/UN-Task-Team-for-Scanner-Data/cpi-new-data-sources-handbook
  repo-branch: main
  repo-actions: [source, issue]
  bread-crumbs: true
  page-navigation: true
  back-to-top-navigation: true
  search: true
  navbar:
    background: primary
    search: true
    title: "New data sources in consumer price statistics"
    right:
      - icon: globe
        href: https://unstats.un.org/wiki/display/GWGSD/Handbook+on+utilising+new+data+sources+in+the+production+of+consumer+price+statistics
      - icon: person-raised-hand
        href: https://unstats.un.org/bigdata/task-teams/scanner/index.cshtml
    left:
      - href: handbook/index.qmd
        text: Handbook


  sidebar:
    - id: handbook
      style: "floating"
      collapse-level: 1
      align: left
      contents:
        - handbook/index.qmd
        - "---"
        - section: "Initial considerations"
          href: handbook/initial-considerations/index.qmd
          contents:
          - handbook/initial-considerations/overview-of-alternative-data-sources.qmd
          - handbook/initial-considerations/why-use-alternative-data-sources-strategic-motivations.qmd
          - handbook/initial-considerations/key-challenges-and-trade-offs.qmd
          - handbook/initial-considerations/key-decision-points.qmd
          - handbook/initial-considerations/resource-implications-and-organisational-readiness.qmd
        - handbook/cpi-production-system-requirements.qmd
        - handbook/quality-assurance.qmd
        - section: "Data selection and acquisition"
          href: handbook/data-selection-and-acquisition/index.qmd
          contents:
            - handbook/data-selection-and-acquisition/selection-of-categories.qmd
            - handbook/data-selection-and-acquisition/selection-of-retailers-for-alternative-data-sources.qmd
            - section: "Scanner data"
              href: handbook/data-selection-and-acquisition/scanner/index.qmd
              contents:
                - handbook/data-selection-and-acquisition/scanner/initial-steps-in-the-acquisition-of-scanner-data.qmd
                - handbook/data-selection-and-acquisition/scanner/data-requirements-specification-for-scanner-data.qmd
                - handbook/data-selection-and-acquisition/scanner/data-sharing-agreements.qmd
                - handbook/data-selection-and-acquisition/scanner/alternative-approaches-to-acquiring-scanner-data.qmd
                - handbook/data-selection-and-acquisition/scanner/monitoring-validation-and-plausibility-checks-for-scanner-data.qmd
            - section: "Web scraping"
              href: handbook/data-selection-and-acquisition/web-scraped/index.qmd
              contents:
                - handbook/data-selection-and-acquisition/web-scraped/different-approaches-to-accessing-web-scraped-data.qmd
                - handbook/data-selection-and-acquisition/web-scraped/strategies-available-for-in-house-web-scraping.qmd
                - handbook/data-selection-and-acquisition/web-scraped/data-requirements-specification-for-web-scraped-data.qmd
                - handbook/data-selection-and-acquisition/web-scraped/monitoring-validation-and-plausibility-checks-for-web-scraped-data.qmd
                - handbook/data-selection-and-acquisition/web-scraped/common-technical-problems-for-in-house-web-scraping.qmd
            - handbook/data-selection-and-acquisition/example-file-structures-for-web-scraped-and-scanner-data.qmd
            - handbook/data-selection-and-acquisition/collection-of-data-via-apis.qmd
            - handbook/data-selection-and-acquisition/dealing-with-unexpected-data-gaps.qmd
    

language:
  title-block-modified: "Last updated"

format:
